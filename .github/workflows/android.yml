name: Build APK - Budget Keluarga

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        working-directory: budget-keluarga-webapp
        run: npm ci

      - name: Add Android platform
        working-directory: budget-keluarga-webapp
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x budget-keluarga-webapp/android/gradlew

      - name: Build Debug APK
        working-directory: budget-keluarga-webapp/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-keluarga-debug
          path: budget-keluarga-webapp/android/app/build/outputs/apk/debug/app-debug.apk

